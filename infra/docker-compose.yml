services:
  server:
    image: node:20-alpine
    working_dir: /app
    command: sh -c "npm install && npm run dev -w server"
    ports:
      - "3000:3000"
    volumes:
      - ..:/app

  client:
    image: node:20-alpine
    working_dir: /app
    command: sh -c "npm install && npm run dev -w client"
    ports:
      - "5173:5173"
    volumes:
      - ..:/app
    depends_on:
      - server
